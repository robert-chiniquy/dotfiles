add_newline = false

format = "$directory$git_branch${custom.accent}$character"
right_format = "$custom$golang$rust$nodejs"

[line_break]
disabled = true

[character]
success_symbol = ' '
error_symbol = '[ !](203)'

[golang]
format = '[$symbol]($style)'
symbol = ""
style = "cyan"

[git_status]
disabled = true
style = "#ff00f8"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "⚔️"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "[?${count}](#5cecff)"
stashed = "[$${count}](#fbb725)"
modified = "[!${count}](#ff0099)"
staged = "[+${count}](#5cecff)"
renamed = "[»${count}](#aa00e8)"
deleted = "[✘${count}](#ff0099)"

[nodejs]
format = '[$symbol]($style)'
symbol = ""
style = "green"

[rust]
format = '[$symbol]($style)'
symbol = ""
style = "#ff0099"

[package]
disabled = true

[git_branch]
format = '[ $symbol$branch(:$remote_branch)]($style)'
style = "#5cecff"
symbol = ""

[battery]
disabled = true

[jobs]
symbol = "+"
style = "#fbb725"
number_threshold = 1
format = "[$symbol$number]($style) "

[memory_usage]
disabled = true

[time]
disabled = true

[directory]
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
style = "#fbb725"

[status]
disabled = false
style = "#ff0099"
format = "[$status]($style) "

[cmd_duration]
disabled = true  # Using custom precmd in .zshrc (shows at 3s, more useful)

[custom.accent]
command = "$HOME/repo/dotfiles/bin/prompt-char"
shell = ["/bin/sh"]
when = true
format = ' $output'
style = ""

