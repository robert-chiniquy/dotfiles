[package]
name = "pr-watch"
version = "0.1.0"
edition = "2021"
description = "Blocking one-line-per-event GitHub PR watcher for agents"

[[bin]]
name = "pr-watch"
path = "src/main.rs"

[[bin]]
name = "sleep-report"
path = "src/sleep_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
