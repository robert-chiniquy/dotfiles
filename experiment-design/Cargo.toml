[package]
name = "experiment-design"
version = "0.1.0"
edition = "2021"
description = "Statistics tool for the experiment-design skill: protocol checks and round decisions."

[lib]
name = "experiment_design"
path = "src/lib.rs"

[[bin]]
name = "experiment-design"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
statrs = { version = "0.19.1", default-features = false }
thiserror = "2.0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
