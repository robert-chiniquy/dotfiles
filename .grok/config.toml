[cli]
installer = "internal"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-build"
yolo = false
compact_mode = false
permission_mode = "always-approve"
theme = "groknight"

[models]
default = "grok-composer-2.5-fast"

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

# Claude compatibility: skills, rules, agents, mcps stay on (defaults).
# hooks=false: Claude Bash matchers are not Grok-native; agent runs bd prime etc. itself.
# Shared guidance: ~/.claude/Claude.md + ~/.claude/skills/ (see ~/.grok/AGENTS.md).
[compat.claude]
hooks = false
skills = true
rules = true
agents = true
mcps = true

# Shared skills live in ~/.claude/skills (canonical). ~/.agents/skills is a
# symlink farm for Codex/other consumers; content is identical. Grok may list
# the agents path for overlapping names (discovery order) — bodies resolve to
# the Claude tree via symlink.
[skills]

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
